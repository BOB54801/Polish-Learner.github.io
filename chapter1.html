<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 1: Pierwszy dzień w szkole</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* A little extra CSS so the tables look nice */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .verb-section-title { margin-top: 40px; border-bottom: 2px solid #ccc; padding-bottom: 5px;}
    </style>
</head>
<body>
    <header>
        <h1>Chapter 1: Pierwszy dzień w szkole</h1>
        <nav>
            <a href="chapter1.html">Chapter 1</a>
        </nav>
    </header>
    
    <main>
        <!-- Vocabulary Section -->
        <section id="vocabulary-section">
            <h2>Vocabulary & Expressions</h2>
            <div id="vocab-container"></div>
        </section>

        <!-- Verbs Section -->
        <section id="verbs-section">
            <h2 class="verb-section-title">Verb Conjugations (Present Tense)</h2>
            <div id="verbs-container"></div>
        </section>
    </main>

    <script src="data.js"></script>
    <script>
        // 1. Render Vocabulary
        const vocabContainer = document.getElementById('vocab-container');
        chapter1Vocab.forEach(item => {
            const card = document.createElement('div');
            card.className = 'vocab-card';
            card.innerHTML = `<strong>${item.pl}</strong>: ${item.en}`;
            vocabContainer.appendChild(card);
        });

        // 2. Render Verbs
        const verbsContainer = document.getElementById('verbs-container');
        chapter1Verbs.forEach(verb => {
            // Create a table container for each verb
            let tableHTML = `
                <div class="verb-table-container">
                    <h3>${verb.infinitive} <em>(${verb.meaning})</em></h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Pronoun</th>
                                <th>Form</th>
                                <th>Meaning</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            // Loop through conjugations and add rows
            verb.conjugations.forEach(conj => {
                tableHTML += `
                            <tr>
                                <td>${conj.pronoun}</td>
                                <td><strong>${conj.form}</strong></td>
                                <td>${conj.meaning}</td>
                            </tr>
                `;
            });
            
            // Close the table
            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;
            
            // Append to the page
            verbsContainer.innerHTML += tableHTML;
        });
    </script>
</body>
</html>
